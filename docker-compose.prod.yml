# OCR Platform - Production Docker Compose
# =========================================
# Stack de produção com alta disponibilidade e otimizações

version: '3.8'

services:
  # Redis Cluster Setup (Master)
  redis:
    image: redis:7-alpine
    container_name: ocr-redis-master
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./docker/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: >
      redis-server /usr/local/etc/redis/redis.conf
      --maxmemory 4gb
      --maxmemory-policy allkeys-lru
      --save 900 1
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 2G
    networks:
      - ocr_network

  # Load Balancer (nginx)
  nginx:
    image: nginx:alpine
    container_name: ocr-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - api-1
      - api-2
    networks:
      - ocr_network

  # API FastAPI (múltiplas instâncias)
  api-1:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: ocr-api-1
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ENVIRONMENT=production
      - DEBUG=false
      - LOG_LEVEL=WARNING
      - API_WORKERS=4
      - WORKER_CLASS=uvicorn.workers.UvicornWorker
    volumes:
      - api_uploads:/app/uploads
      - api_results:/app/results
      - api_temp:/app/temp
      - ./logs/api:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    networks:
      - ocr_network

  api-2:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: ocr-api-2
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ENVIRONMENT=production
      - DEBUG=false
      - LOG_LEVEL=WARNING
      - API_WORKERS=4
    volumes:
      - api_uploads:/app/uploads
      - api_results:/app/results
      - api_temp:/app/temp
      - ./logs/api:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    networks:
      - ocr_network

  # Workers Base (múltiplas instâncias)
  workers-base-1:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: ocr-workers-base-1
    restart: unless-stopped
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ENVIRONMENT=production
      - DEBUG=false
      - LOG_LEVEL=WARNING
      - WORKER_TYPE=base
      - WORKER_CONCURRENCY=4
    volumes:
      - api_uploads:/app/uploads
      - api_results:/app/results
      - api_temp:/app/temp
      - ./logs/workers:/app/logs
      - worker_cache:/app/cache
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '3.0'
          memory: 6G
        reservations:
          cpus: '2.0'
          memory: 4G
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
    networks:
      - ocr_network

  workers-base-2:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: ocr-workers-base-2
    restart: unless-stopped
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ENVIRONMENT=production
      - DEBUG=false
      - LOG_LEVEL=WARNING
      - WORKER_TYPE=base
      - WORKER_CONCURRENCY=4
    volumes:
      - api_uploads:/app/uploads
      - api_results:/app/results
      - api_temp:/app/temp
      - ./logs/workers:/app/logs
      - worker_cache:/app/cache
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '3.0'
          memory: 6G
        reservations:
          cpus: '2.0'
          memory: 4G
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
    networks:
      - ocr_network

  # Worker TrOCR (GPU - produção)
  worker-trocr:
    build:
      context: .
      dockerfile: docker/Dockerfile.trocr
    container_name: ocr-worker-trocr-prod
    restart: unless-stopped
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ENVIRONMENT=production
      - DEBUG=false
      - LOG_LEVEL=WARNING
      - WORKER_TYPE=trocr
      - CUDA_VISIBLE_DEVICES=0
      - WORKER_CONCURRENCY=2
    volumes:
      - api_uploads:/app/uploads
      - api_results:/app/results
      - api_temp:/app/temp
      - ./logs/workers:/app/logs
      - trocr_cache:/app/cache
      - trocr_models:/app/models
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 12G
        reservations:
          memory: 8G
      restart_policy:
        condition: on-failure
        delay: 30s
        max_attempts: 3
    # Uncomment for GPU support
    # runtime: nvidia
    # environment:
    #   - NVIDIA_VISIBLE_DEVICES=0
    networks:
      - ocr_network

  # Worker Surya (GPU - produção)
  worker-surya:
    build:
      context: .
      dockerfile: docker/Dockerfile.surya
    container_name: ocr-worker-surya-prod
    restart: unless-stopped
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ENVIRONMENT=production
      - DEBUG=false
      - LOG_LEVEL=WARNING
      - WORKER_TYPE=surya
      - CUDA_VISIBLE_DEVICES=1
      - WORKER_CONCURRENCY=3
    volumes:
      - api_uploads:/app/uploads
      - api_results:/app/results
      - api_temp:/app/temp
      - ./logs/workers:/app/logs
      - surya_cache:/app/cache
      - surya_models:/app/models
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 12G
        reservations:
          memory: 8G
      restart_policy:
        condition: on-failure
        delay: 30s
        max_attempts: 3
    # Uncomment for GPU support
    # runtime: nvidia
    # environment:
    #   - NVIDIA_VISIBLE_DEVICES=1
    networks:
      - ocr_network

  # Flower - Monitoramento (protegido)
  flower:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: ocr-flower-prod
    restart: unless-stopped
    expose:
      - "5555"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ENVIRONMENT=production
      - FLOWER_BASIC_AUTH=admin:${FLOWER_PASSWORD:-changeme}
    command: >
      celery -A app.core.celery_app flower
      --port=5555
      --basic_auth=admin:${FLOWER_PASSWORD:-changeme}
      --url_prefix=flower
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
        reservations:
          cpus: '0.2'
          memory: 512M
    networks:
      - ocr_network

  # Prometheus - Métricas
  prometheus:
    image: prom/prometheus:latest
    container_name: ocr-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    networks:
      - ocr_network

  # Grafana - Dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: ocr-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus
    networks:
      - ocr_network

# Volumes para produção
volumes:
  redis_data:
    driver: local
  api_uploads:
    driver: local
  api_results:
    driver: local
  api_temp:
    driver: local
  worker_cache:
    driver: local
  trocr_cache:
    driver: local
  trocr_models:
    driver: local
  surya_cache:
    driver: local
  surya_models:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

# Networks para produção
networks:
  ocr_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.22.0.0/16